# Dataset hints for the order-management OCEL log.
#
# Loaded automatically by src.llm.dataset_hints.DatasetHints.load when the
# healer opens data/order-management.sqlite. Prompts stay dataset-agnostic;
# anything log-specific lives here.

data_semantics: |
  Each object-type table stores the initial object state (`ocel_changed_field`
  IS NULL) plus one row per attribute change. NULL values in change rows are
  normal — only the changed attribute is required. The violation you are
  repairing comes from an initial-state row, so the NULL IS genuinely missing.

attribute_hints:
  weight:
    object_types: [products, product]
    id_is_name: true
    guidance: |
      For products, look at `anchor_entity.name` to identify the product
      (in this log, product names are stored as the ocel_id, so we use
      it as the name). Recall the product's real-world weight from
      general knowledge. Return the value in the SAME unit as the peers
      — check `peer_objects` to determine kg vs g.
